<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#003366" />
  <title>Ambassadors FC — Session Calendar</title>
  <style>
    :root { --navy:#003366; --player:#0055A5; --bg:#F5F7FA; --text:#222; --muted:#666; --white:#fff; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    header { background:var(--navy); color:#fff; padding:14px 16px; }
    header h1 { font-size:1.1rem; }
    header .sub { font-size:0.8rem; opacity:0.85; }
    .wrap { max-width:980px; margin:0 auto; padding:16px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .month-nav { display:flex; align-items:center; gap:8px; }
    button, .btn { background:var(--navy); color:#fff; border:none; border-radius:8px; padding:8px 12px; font-weight:600; cursor:pointer; }
    .month-nav button { width:36px; height:36px; }
    .filters button { background:#fff; color:var(--navy); border:1.5px solid var(--navy); border-radius:20px; padding:6px 12px; font-size:0.8rem; }
    .filters button.active { background:var(--navy); color:#fff; }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .dow { text-align:center; font-size:0.75rem; color:var(--muted); font-weight:600; padding:6px 0; }
    .day { background:#fff; border-radius:10px; min-height:72px; padding:8px; border:1px solid #e5e7eb; cursor:pointer; }
    .day:hover { border-color:var(--navy); }
    .day.other { opacity:0.4; }
    .day .n { font-weight:700; color:var(--navy); font-size:0.9rem; }
    .day .tag { font-size:0.65rem; margin-top:4px; padding:2px 6px; border-radius:4px; background:#E6EEF5; color:var(--navy); display:inline-block; }
    .panel { display:none; margin-top:16px; background:#fff; border-radius:12px; border:1px solid #e5e7eb; overflow:hidden; }
    .panel.open { display:block; }
    .panel-head { background:var(--navy); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
    .panel-body { padding:14px; }
    .card { border:1px solid #e5e7eb; border-radius:10px; padding:12px; margin-bottom:10px; }
    .card h4 { color:var(--navy); margin:4px 0; }
    .blocks { list-style:none; margin:8px 0; }
    .blocks li { padding:6px 0; border-bottom:1px solid #f0f0f0; font-size:0.9rem; }
    .plan-preview img { width:100%; margin:8px 0; border-radius:6px; border:1px solid #ddd; }
    footer { text-align:center; color:var(--muted); font-size:0.75rem; padding:20px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AMBASSADORS FC — Session Calendar</h1>
      <div class="sub">Weekly training · Click a date · Phone-friendly</div>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <div class="month-nav">
        <button type="button" id="prevMonth">‹</button>
        <h2 id="monthLabel">—</h2>
        <button type="button" id="nextMonth">›</button>
      </div>
      <div class="filters">
        <button type="button" data-team="all" class="active">All</button>
        <button type="button" data-team="2011/2012">11/12</button>
        <button type="button" data-team="2009/2010">09/10</button>
      </div>
      <button type="button" id="btnReset">Reset data</button>
    </div>
    <div class="calendar" id="calendar"></div>
    <div class="panel" id="panel">
      <div class="panel-head">
        <div><h3 id="panelTitle">—</h3><div id="panelMeta" style="font-size:0.8rem;opacity:0.85"></div></div>
        <button type="button" id="closePanel" style="background:transparent;color:#fff;font-size:1.4rem">×</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>
  <footer>Ambassadors FC · 11/12 Mon 7:45–9 & Wed 8:45–10 · 09/10 opposite</footer>
<script>
const EMBEDDED_DATA = {"team_colors":{"2011/2012":"#003366","2009/2010":"#1E429D"},"schedule":{"2011/2012":{"label":"11/12 Boys","slots":[{"weekday":1,"time":"7:45–9:00 PM","duration_min":75},{"weekday":3,"time":"8:45–10:00 PM","duration_min":75}]},"2009/2010":{"label":"09/10 Boys","slots":[{"weekday":1,"time":"8:45–10:00 PM","duration_min":75},{"weekday":3,"time":"7:45–9:00 PM","duration_min":75}]}},"holidays":[],"sessions":[{"id":"2026-11-09-0910","date":"2026-11-09","day":"Monday","team":"2009/2010","team_label":"09/10 Boys","time":"8:45–10:00 PM","title":"AFC Session for 11/9 for the 2009/2010 Team","focus":"Pressure · Cover · Balance · Give & Go · Full-field game","duration_min":75,"blocks":[{"time":"15 min","name":"Warm-up","detail":"Guided dynamic + juggling"},{"time":"15 min","name":"Passing","detail":"Give & Go Triangle — groups of 5"},{"time":"15 min","name":"PCB","detail":"Pressure · Cover · Balance (2 shapes)"},{"time":"30 min","name":"Scrimmage","detail":"Full field · ~10v10 / 11v11"}],"pdf":"plans/AFC_Session_09-10_2026-11-09.pdf","pdf_name":"AFC_Session_09-10_2026-11-09.pdf","previews":["plans/previews/2026-11-09-0910_p1.jpg","plans/previews/2026-11-09-0910_p2.jpg","plans/previews/2026-11-09-0910_p3.jpg"],"notes":""},{"id":"2026-11-09-1112","date":"2026-11-09","day":"Monday","team":"2011/2012","team_label":"11/12 Boys","time":"7:45–9:00 PM","title":"Week 1 — As completed (4v1 switch)","focus":"Dynamics · Give & Go · Turns · 4v1 switch · 5v5","duration_min":75,"blocks":[{"time":"15 min","name":"Warm-up","detail":"Dynamics (strong) · juggles limited"},{"time":"10 min","name":"Give & Go","detail":"Groups of 5"},{"time":"20 min","name":"Stations","detail":"Turns to Goals · 1-touch 4v1 switch"},{"time":"~30 min","name":"Scrimmage","detail":"5v5"}],"pdf":"plans/AFC_Session_Week1_2026-11.pdf","pdf_name":"AFC_Session_Week1_2026-11.pdf","previews":["plans/previews/2026-11-09-1112_p1.jpg","plans/previews/2026-11-09-1112_p2.jpg","plans/previews/2026-11-09-1112_p3.jpg","plans/previews/2026-11-09-1112_p4.jpg","plans/previews/2026-11-09-1112_p5.jpg"],"notes":"No rondo — used 4v1 switch. No devo — hold for Wed 09/10 + next week 11/12."},{"id":"2026-11-11-0910","date":"2026-11-11","day":"Wednesday","team":"2009/2010","team_label":"09/10 Boys","time":"7:45–9:00 PM","title":"Passing · 4v1 return · Finishing · Devo","focus":"Wed warm-up · 2 in center · 1-touch return 4v1 · 1v2 to 4 goals · One body","duration_min":75,"blocks":[{"time":"15 min","name":"Warm-up","detail":"Mario jumps/skips · knees-over-toe lunges · wide bounds · open/close gate · back pedal→sprint · juggles"},{"time":"10 min","name":"Passing","detail":"2 in the center — exchange then out"},{"time":"20 min","name":"Stations","detail":"4v1 return passes · 1v2 to 4 goals"},{"time":"20 min","name":"Game","detail":"Apply combination & finishing"},{"time":"10 min","name":"Devotion","detail":"1 Cor 12 — Why is it important to be whole?"}],"pdf":"plans/AFC_Session_09-10_2026-11-11.pdf","pdf_name":"AFC_Session_09-10_2026-11-11.pdf","previews":["plans/previews/2026-11-11-0910_p1.jpg","plans/previews/2026-11-11-0910_p2.jpg","plans/previews/2026-11-11-0910_p3.jpg","plans/previews/2026-11-11-0910_p4.jpg","plans/previews/2026-11-11-0910_p5.jpg"],"notes":"Wed warm-up (both teams). 4v1 = 1-touch return passes."},{"id":"2026-11-11-1112","date":"2026-11-11","day":"Wednesday","team":"2011/2012","team_label":"11/12 Boys","time":"8:45–10:00 PM","title":"Passing (2 in center) · 4 × 12 min games","focus":"Wed warm-up · High-touch passing · Match play","duration_min":75,"blocks":[{"time":"15 min","name":"Warm-up","detail":"Mario jumps/skips · knees-over-toe lunges · wide bounds · open/close gate · back pedal→sprint · juggles"},{"time":"10 min","name":"Passing","detail":"2 in the center — exchange then out"},{"time":"48 min","name":"Games","detail":"4 × 12 min — teams preset"}],"pdf":"plans/AFC_Session_11-12_2026-11-11.pdf","pdf_name":"AFC_Session_11-12_2026-11-11.pdf","previews":["plans/previews/2026-11-11-1112_p1.jpg","plans/previews/2026-11-11-1112_p2.jpg"],"notes":"Teams made beforehand. Devo next week for 11/12."}]};
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const STORAGE_KEY = "afc_sessions_v1";
function storageAvailable(){try{var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}}
var CAN_STORE=false;try{CAN_STORE=storageAvailable();}catch(e){}
function safeGet(k){if(!CAN_STORE)return null;try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){if(!CAN_STORE)return false;try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function safeRemove(k){if(!CAN_STORE)return;try{localStorage.removeItem(k);}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function normalizeData(raw){var base=clone(EMBEDDED_DATA);if(!raw||typeof raw!=="object")return base;return{team_colors:raw.team_colors||base.team_colors,schedule:raw.schedule||base.schedule,holidays:Array.isArray(raw.holidays)?raw.holidays:base.holidays,sessions:Array.isArray(raw.sessions)?raw.sessions:base.sessions};}
var data=normalizeData(EMBEDDED_DATA);
var view=new Date(2026,10,1);var teamFilter="all";
function dateKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function sessionsFor(key){return (data.sessions||[]).filter(function(s){if(s.date!==key)return false;if(teamFilter!=="all"&&s.team!==teamFilter)return false;return true;});}
function render(){var y=view.getFullYear(),m=view.getMonth();
document.getElementById("monthLabel").textContent=view.toLocaleString("en-US",{month:"long",year:"numeric"});
var first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();
var cal=document.getElementById("calendar");cal.innerHTML="";
DOW.forEach(function(d){var el=document.createElement("div");el.className="dow";el.textContent=d;cal.appendChild(el);});
for(var i=0;i<start;i++){var e=document.createElement("div");e.className="day other";cal.appendChild(e);}
for(var d=1;d<=days;d++){(function(day){var key=dateKey(y,m,day);var el=document.createElement("div");el.className="day";
var html="<div class=\"n\">"+day+"</div>";var ss=sessionsFor(key);ss.forEach(function(s){html+="<div class=\"tag\">"+(s.team_label||s.team)+"</div>";});
el.innerHTML=html;el.onclick=function(){openDay(key,y,m,day);};cal.appendChild(el);})(d);}
}
function openDay(key,y,m,d){var panel=document.getElementById("panel");panel.classList.add("open");
document.getElementById("panelTitle").textContent=new Date(y,m,d).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
document.getElementById("panelMeta").textContent="Trainings";
var body=document.getElementById("panelBody");var ss=sessionsFor(key).slice().sort(function(a,b){return (a.time||"").localeCompare(b.time||"");});
if(!ss.length){body.innerHTML="<p style=\"color:#666\">No detailed session plans for this date yet.</p>";return;}
body.innerHTML=ss.map(function(s){var blocks=(s.blocks||[]).map(function(b){return "<li><strong>"+b.time+" "+b.name+"</strong> — "+b.detail+"</li>";}).join("");
var prev="";if(s.previews&&s.previews.length){prev="<button type=\"button\" class=\"btn\" data-show=\""+s.id+"\" style=\"margin-top:8px\">View session plan</button><div class=\"plan-preview\" data-plan=\""+s.id+"\" style=\"display:none\"></div>";}
return "<div class=\"card\"><div style=\"font-weight:700;color:var(--navy)\">"+(s.time||"")+" · "+(s.team_label||s.team)+"</div><h4>"+(s.title||"Training")+"</h4><div style=\"font-size:0.8rem;color:#666\">"+(s.focus||"")+"</div><ul class=\"blocks\">"+blocks+"</ul>"+prev+"</div>";}).join("");
body.querySelectorAll("[data-show]").forEach(function(btn){btn.onclick=function(){var id=btn.getAttribute("data-show");var s=(data.sessions||[]).find(function(x){return x.id===id;});var wrap=body.querySelector('[data-plan="'+id+'"]');
if(wrap.style.display==="block"){wrap.style.display="none";btn.textContent="View session plan";return;}
wrap.innerHTML=(s.previews||[]).map(function(src,i){return '<img src="'+src+'" alt="Page '+(i+1)+'" />';}).join("");
wrap.style.display="block";btn.textContent="Hide session plan";};});
}
document.getElementById("prevMonth").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);render();};
document.getElementById("nextMonth").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);render();};
document.getElementById("closePanel").onclick=function(){document.getElementById("panel").classList.remove("open");};
document.querySelectorAll(".filters button").forEach(function(btn){btn.onclick=function(){document.querySelectorAll(".filters button").forEach(function(b){b.classList.remove("active");});btn.classList.add("active");teamFilter=btn.dataset.team;render();};});
document.getElementById("btnReset").onclick=function(){if(!confirm("Reload built-in schedule?"))return;safeRemove(STORAGE_KEY);data=clone(EMBEDDED_DATA);render();};
function load(){var raw=null;try{var saved=safeGet(STORAGE_KEY);if(saved)raw=JSON.parse(saved);}catch(e){}data=normalizeData(raw);if((!data.sessions||!data.sessions.length)&&EMBEDDED_DATA)data=clone(EMBEDDED_DATA);render();}
load();
</script>
</body>
</html>
